[project]
name = "cripta"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "David Zuñiga", email = "davidzunigaobando@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "requests>=2.34.2",
    "rich>=15.0.0",
    "textual>=8.2.8",
]

[project.optional-dependencies]
grafica = ["arcade>=3.3,<4"]

[project.scripts]
cripta = "cripta.__main__:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
